[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "gexis-core"
version = "0.1.0"
description = "Gexis Player arbitration core (Phase 2b)"
requires-python = ">=3.11"
# Exact pins, not ranges - matches the pin-and-verify discipline the image
# build already applies to peppyalsa (commit) and go-librespot (checksum).
# Hash-pinning (pip install --require-hashes) is stronger and not done yet -
# see ADR-0021's venv addendum, "Unverified".
dependencies = [
    "aiohttp==3.14.3",
    "dbus-next==0.2.3",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    # What the image's own tools are tested with: the skin packs and
    # letterboxing (Pillow), the visualiser's renderers (pygame), the photo
    # placement (numpy, OpenCV). Without them those tests skip.
    "pillow==12.3.0",
    "pygame==2.6.1",
    "numpy==2.5.4",
    "opencv-python-headless==5.0.0.93",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gexis_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

