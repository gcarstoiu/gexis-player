# ADR-0173: a release built on GitHub's arm64 machines, natively, from its
# tag, with the same make targets and scripts as a local build; signed on
# R2D2 afterwards (publish.sh --sign), where the release key is.
#
# - a tag v<x.y.z>: the release, built, then uploaded unsigned and attested;
# - by hand: a branch's packages for a preview (kind: preview), or the whole
#   release without uploading it (kind: release).
name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
      kind:
        description: What to build
        type: choice
        options: [preview, release]
        default: preview

permissions:
  contents: read

# A release's run is never cancelled by a later push (BUILD-TRAPS: a
# cancelled run counted as failed).
concurrency:
  group: release-build-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Packages and image
    # Pinned, not -latest: ubuntu-latest moves to 26.04 in November 2026.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    env:
      REF: ${{ inputs.ref || github.sha }}
      KIND: ${{ inputs.kind || 'release' }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # The caches start empty (ADR-0042, "a build that has never seen the
      # cache has to work"); the mirror and the published parts fill them.
      - name: The machine
        run: |
          for v in GEXIS_BUILD_CACHE=cache/downloads GEXIS_DEB_CACHE=cache/debs GEXIS_PUBLISHED=published OS_DEBS=cache/os-debs RUN=run; do
            mkdir -p "$RUNNER_TEMP/${v#*=}"; echo "${v%%=*}=$RUNNER_TEMP/${v#*=}" >> "$GITHUB_ENV"
          done
          { uname -m; nproc; free -h; df -h /; docker version --format '{{.Server.Version}}'; } | tee "$RUNNER_TEMP/run/machine.txt"

      # The image (5.2 GB), pi-gen's work and the copies out took 33 GB at the
      # peak (Finding 140); the runner promises 14.
      - name: Free disk
        if: env.KIND == 'release'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/local/share/swift /usr/local/julia* /opt/hostedtoolcache \
            /usr/local/share/powershell /usr/local/share/chromium /usr/lib/jvm /opt/microsoft /opt/google
          docker image prune -af >/dev/null
          df -h /

      - name: Watch the disk
        run: nohup sh -c 'while :; do echo "$(date +%s) $(df -B1 --output=used / | tail -1)"; sleep 10; done' > "$RUN/disk.log" 2>&1 &

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0 # package versions come from each package's last commit
          submodules: true
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The mirror first, upstream only for what it lacks (ADR-0173).
      - name: Downloads from the mirror
        run: packaging/inputs.sh fill "$GEXIS_BUILD_CACHE"

      # The published skin packs and wallpapers, so a version that did not
      # change is the published file, not a rebuild (BUILD-TRAPS, 1.4.0).
      - name: What the published releases hold
        run: |
          packaging/release/published.py indexes "$GEXIS_PUBLISHED"
          packaging/release/published.py last "$GEXIS_PUBLISHED" "$GEXIS_DEB_CACHE" gexis-wallpapers \
            gexis-skins-1920x1080 gexis-skins-1280x400 gexis-skins-1480x320 gexis-skins-800x480 gexis-skins-1280x800

      - name: Packages
        run: make packages

      - name: Image
        if: env.KIND == 'release'
        run: make -o packages -o ui image

      - name: Verify the image
        if: env.KIND == 'release'
        run: image/verify-image.sh image/deploy/*-gexis-player*.img

      # Everything the build downloaded is listed, with its licence.
      - name: Every download listed
        run: packaging/inputs.sh unlisted "$GEXIS_BUILD_CACHE"

      - name: The release's parts, unsigned
        id: release
        if: env.KIND == 'release'
        run: |
          img=$(ls image/deploy/*-gexis-player*.img)
          GEXIS_DEB_CACHE="$OS_DEBS" packaging/release/build.sh "$img" --unsigned
          dest=$(ls -d packaging/release/out/r*)
          echo "tag=$(basename "$dest")" >> "$GITHUB_OUTPUT"
          mkdir -p "$dest/image"
          xz -T0 -6 -c "$img" > "$dest/image/gexis-player.img.xz"
          (cd "$dest/image" && sha256sum gexis-player.img.xz > gexis-player.img.xz.sha256)
          cp image/deploy/*-gexis-player*.info "$dest/image/gexis-player.info"
          printf 'Run: %s\nCommit: %s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$(git rev-parse HEAD)" > "$dest/build.txt"
          rm -f "$dest/image.txt"   # a path on this runner

      - name: The disk at its peak
        if: always()
        run: |
          sort -k2 -n "$RUN/disk.log" | tail -1 | awk '{printf "peak used on /: %.1f GB\n", $2 / 1e9}'

      - name: Keep the release
        if: env.KIND == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: packaging/release/out/
          retention-days: 7
          compression-level: 0

      - name: Keep the packages for a preview
        if: env.KIND == 'preview'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: packaging/out/*.deb
          retention-days: 7
          compression-level: 0

  # Only a release tag uploads, and only this job may write: the build ran
  # third-party code (npm, pi-gen, the archives' packages) with read access.
  upload:
    name: Upload, unsigned
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag's release notes, read by publish.sh
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: packaging/release/out/

      # What R2D2 signs, and the image, attested as built here from this tag.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            packaging/release/out/${{ env.TAG }}/parts.plain
            packaging/release/out/${{ env.TAG }}/build.txt
            packaging/release/out/${{ env.TAG }}/repos/*/Release
            packaging/release/out/${{ env.TAG }}/repos/*/Packages
            packaging/release/out/${{ env.TAG }}/image/gexis-player.img.xz

      - name: Upload
        run: packaging/release/publish.sh --upload "$TAG"
