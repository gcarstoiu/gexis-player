# The core's tests and the UI's build, on every push and every pull request
# into main (George, 2026-10-18). A release PR shows the result before it is
# merged, and main's ruleset requires both to pass.
#
# Python 3.13 is the one the player runs (Raspberry Pi OS trixie). Squeezelite's
# own tests run in Docker when squeezelite is built, not here.
name: Tests

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - name: Install
        working-directory: core
        run: pip install -e ".[test]"
      - name: Test
        working-directory: core
        env:
          PYTHONPATH: src
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m pytest -q -p no:warnings

  ui:
    name: UI build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Build
        working-directory: ui
        run: npm run build
