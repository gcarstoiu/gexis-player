name: Hardware feedback
description: How a sound card or screen works with Gexis Player - sent from Settings → System → Hardware feedback.
title: "[Hardware] "
labels: ["hardware feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you - feedback like this is how Gexis learns which sound cards and screens work.
        The player filled in what it can read itself; nothing in it names you, your network or the
        hardware's serial numbers. It is public, so anyone can see what works before buying.
  - type: input
    id: board
    attributes:
      label: Sound card
    validations:
      required: true
  - type: input
    id: screen
    attributes:
      label: Screen
  - type: input
    id: sound
    attributes:
      label: Did the music sound right?
      description: "Filled in by the player: Yes, No or Not tried."
    validations:
      required: true
  - type: input
    id: volume
    attributes:
      label: Did the volume change with the slider?
      description: "Filled in by the player: Yes, No or Not tried."
  - type: input
    id: clicks
    attributes:
      label: Any clicks or gaps between tracks?
      description: "Filled in by the player: No, Yes or Not tried."
  - type: input
    id: picture
    attributes:
      label: Is the whole picture visible on the screen?
      description: "Filled in by the player: Yes, No or No screen."
  - type: input
    id: touch
    attributes:
      label: Does a tap land where the finger is?
      description: "Filled in by the player: Yes, No or No touch."
  - type: textarea
    id: notes
    attributes:
      label: Anything else
  - type: textarea
    id: details
    attributes:
      label: What the player read
      description: Filled in by the player. Please leave it as it is.
      render: text
