pcm.output {
    type meter
    slave.pcm "hw:sndrpihifiberry"
    scopes.0 peppyalsa
}

pcm_scope.peppyalsa {
    type peppyalsa
    decay_ms 400
    meter "/tmp/peppymeter"
    meter_max 100
    meter_show 0
    spectrum "/tmp/peppyspectrum"
    spectrum_max 100
    spectrum_size 30
    logarithmic_frequency 1
    logarithmic_amplitude 1
    smoothing_factor 50
    window 3
}

pcm_scope_type.peppyalsa {
    lib /usr/lib/libpeppyalsa.so
}
