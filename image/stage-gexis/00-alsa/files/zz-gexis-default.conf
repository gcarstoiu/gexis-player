# The ALSA default is our output (ADR-0085).
#
# **For software that cannot be told about `pcm.output`.** Plexamp headless
# enumerates its own device list - `default`, `sysdefault`, `bluealsa`, and one
# entry per `hw:` card - and `pcm.output` is not in it, even though `aplay -L`
# lists it. Setting Plexamp's device to `output` is silently ignored: its
# lookup misses, it falls back to "Follows System Output", and the audio went
# to HDMI (Finding 077).
#
# That left naming the card by index - `hw:5,0`, which is exactly what ADR-0009
# forbids and which Finding 005 measured at three different values on three
# machines - or taking ALSA's stock default, which is card 0. Both bypass
# `pcm.output`, so peppyalsa is not in the path and the visualiser gets
# nothing.
#
# **A plain alias, not a `plug` layer.** `type plug` over `output` was tried
# and works, and is worse: it would silently convert rather than let the card
# refuse, on a device whose point is not converting. The alias gives an
# application on the default exactly the chain a renderer gets. (Note the
# `plug` that *does* break things is one placed *under* the meter - see
# `outputs.render()` - and nothing here adds a plug anywhere.)
#
# **Nothing was using the default before this**, checked on the device:
# squeezelite is `-o output`, go-librespot is `audio_device: output`,
# bluealsa-aplay is `--pcm=output`, and nothing defined `pcm.default` at all.
#
# `output` is rewritten by `outputs.render()` whenever ADR-0055's row changes,
# so this follows the chosen output without knowing the row exists. It lives in
# its own file for that reason: `output.conf` is regenerated, this never varies.
pcm.!default "output"
