# ADR-0162 D1: the equaliser's loopback. While the equaliser is on, every
# renderer plays into device 0 and CamillaDSP captures device 1; off, nothing
# opens it and the output's own chain is as it was (bit-perfect).
#
# ADR-0166 D1: a second card, Multiroom, for a player in a group: its
# renderers play into it, and Snapcast's feeder captures it.
#
# ADR-0172: a third, Roon, the one card Roon Bridge sees: it plays into
# device 0, and the Roon plugin copies device 1 into the player's output.
#
# One substream each: whoever opens it holds it, as with a sound card, so one
# source at a time still plays (ADR-0009). index intentionally omitted: they
# are referenced by their ids, never by index; and the core keeps both out of
# the outputs it offers.
options snd-aloop enable=1,1,1 id=Loopback,Multiroom,Roon pcm_substreams=1,1,1
