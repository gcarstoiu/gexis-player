# ADR-0162 D1: the equaliser's loopback. While the equaliser is on, every
# renderer plays into device 0 and CamillaDSP captures device 1; off, nothing
# opens it and the output's own chain is as it was (bit-perfect).
#
# One substream: whoever opens it holds it, as with a sound card, so one
# source at a time still plays (ADR-0009). index intentionally omitted: it
# is referenced by its id, Loopback, never by index; and the core keeps it
# out of the outputs it offers.
options snd-aloop id=Loopback pcm_substreams=1
