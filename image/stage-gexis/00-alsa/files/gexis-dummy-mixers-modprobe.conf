# Two private, audio-path-free ALSA controls (B2, George's decision
# 2026-09-08) - squeezelite (-O/-V) and bluealsa-aplay (--mixer-device/
# --mixer-name) each write to their own, instead of both writing to the
# shared hardware DAC directly regardless of which renderer is actually
# allowed to be heard (confirmed on hardware: raising LMS's volume from
# the app audibly changed an active Bluetooth stream). gexis-core is the
# only thing that ever copies a value from these onto real hardware, and
# only while that control's renderer is the active one - see volume.py's
# DummyMixerBridge.
#
# pcm_devs=0: no audio ever goes through either card, only their mixer
# controls - no reason to also create fake PCM playback devices.
# index intentionally omitted: referenced by id everywhere downstream
# (never by index - the project's standing ALSA rule), so which index
# the kernel happens to assign doesn't matter.
options snd-dummy enable=1,1 id=gexislmsvol,gexisbtvol pcm_devs=0,0
