# Two private, audio-path-free ALSA controls (B2, George's decision
# 2026-09-08) - squeezelite (-O/-V) and bluealsa-aplay (--mixer-device/
# --mixer-name) each write to their own, instead of both writing to the
# shared hardware DAC directly regardless of which renderer is actually
# allowed to be heard (confirmed on hardware: raising LMS's volume from
# the app audibly changed an active Bluetooth stream). gexis-core is the
# only thing that ever copies a value from these onto real hardware, and
# only while that control's renderer is the active one - see volume.py's
# DummyMixerBridge.
#
# pcm_devs=0: no audio ever goes through either card, only their mixer
# controls - no reason to also create fake PCM playback devices.
# index intentionally omitted: referenced by id everywhere downstream
# (never by index - the project's standing ALSA rule), so which index
# the kernel happens to assign doesn't matter.
# **0..127, to match AVRCP exactly** (2026-09-22). Bluetooth's volume is
# 0-127 on the wire and `bluealsa-aplay --volume=mixer` syncs it against
# this control *both ways*. At the default range - -50..100, 151 values -
# that round trip is lossy: measured in bluealsa's own log during a storm,
# 107 went out and 108 came back, 102 out and 101 back. Every drift is a
# fresh change, which is a fresh push to the phone, which echoes it: a
# ratchet that only settles by luck, and when the phone cannot absorb the
# pushes BlueZ starts refusing them and bluealsa retries ~750 a second
# until it dies of SIGBUS (Finding 045 §9, §12).
#
# 128 values against 128 makes it exact. The cost is measured too: the
# driver's dB scale is fixed at -45 dB for the control's minimum with
# 0.30 dB a step, so a 128-step range tops out at -6.90 dB rather than 0.
# `volume.py` takes that back with a constant 6.9 dB shift - the window
# becomes -38.1..0 rather than -45..0, which spends the loss at the quiet
# end where 7 dB is a much smaller thing.
options snd-dummy enable=1,1 id=gexislmsvol,gexisbtvol pcm_devs=0,0 mixer_volume_level_min=0 mixer_volume_level_max=127
