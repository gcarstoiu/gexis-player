# ADR-0179: the plugin runs as Shairport Sync does, which shares its runtime
# folder, the metadata pipe and the hook's socket; its own unit, from the
# plugin's release, names pi. gexis-plugins: the core's plugin socket.
[Service]
User=gexis-airplay
Group=gexis-airplay
SupplementaryGroups=gexis-plugins
