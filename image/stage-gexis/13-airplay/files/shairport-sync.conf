// Gexis Player's Shairport Sync (ADR-0167). The name is the player's own,
// given on the command line (-a) from /etc/gexis/device-name.env.
general = {
	output_backend = "alsa";
	mdns_backend = "avahi";
	// The level is the core's: the sender's slider is reported to it by the
	// plugin (the metadata pipe's pvol), and applied on the player's output.
	ignore_volume_control = "yes";
	dbus_service_bus = "system";
};

sessioncontrol = {
	// The device is asked for before Shairport Sync opens it.
	run_this_before_entering_active_state = "/usr/lib/gexis/airplay-hook begin";
	run_this_after_exiting_active_state = "/usr/lib/gexis/airplay-hook end";
	wait_for_completion = "yes";
	active_state_timeout = 10.0;
};

alsa = {
	// The player's output, as every renderer's (ADR-0009, ADR-0166).
	output_device = "output";
	output_rate = "auto";
	output_format = "auto";
	disable_standby_mode = "never";
};

metadata = {
	enabled = "yes";
	include_cover_art = "yes";
	pipe_name = "/run/gexis-airplay/metadata";
	// Covers go through the pipe only; nothing is kept on the card.
	cover_art_cache_directory = "";
};
