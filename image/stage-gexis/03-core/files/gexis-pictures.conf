# The idle screen's own pictures, over SMB (ADR-0049).
#
# **One directory and nothing else.** Not the home directory, not
# /var/lib/gexis-core - which holds the settings database, the enrichment
# cache and the downloaded wallpaper cache - and not a parent of either. A
# share is a hole in a box and should be the size of what goes through it.
#
# **Guest-writable, because the LAN already is.** ADR-0028 leaves the whole
# command API unauthenticated here, so anyone who can reach this device can
# already change its volume and its settings. A wallpaper folder is the same
# class of exposure and a smaller one. A password here, with that door open,
# would be a lock on the window beside it.
#
# `force user` so every write lands with the same owner whoever connected:
# the directory cannot collect files the next writer cannot replace. The
# daemon runs as root and only ever reads, and only ever as an image.
[pictures]
   comment = Gexis idle screen pictures
   path = /var/lib/gexis-core/pictures
   browseable = yes
   writable = yes
   guest ok = yes
   force user = pi
   force group = pi
   create mask = 0644
   directory mask = 0755
   # Nothing here is ever executed. Samba offers these bits to Windows
   # clients as "archive/system/hidden"; turning them off means a file
   # arriving from a PC cannot land with an execute bit at all.
   map archive = no
   map system = no
   map hidden = no

# **Debian's stock smb.conf shares three more things**, and this file is
# included after it so that it can say no to all of them: `[homes]` (every
# local user's home directory), `[printers]` and `[print$]` (a printer
# driver drop). None of them is why samba is on this device, and ADR-0049
# says one hole in the box. Redefined rather than deleted from their file,
# so a package upgrade that rewrites smb.conf cannot quietly bring them
# back - and the build asserts the *effect* with samba's own parser, not
# that our edit landed.
[homes]
   available = no
[printers]
   available = no
[print$]
   available = no
