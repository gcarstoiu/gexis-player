# Gexis Player: no systemd status lines on the console during boot
# (ADR-0043). Set here, not as systemd.show_status=false on the kernel's
# command line: Raspberry Pi's first boot strips every systemd.* option
# from cmdline.txt, and putting it back there made the first system update
# on every device restart it (found 2026-10-01).
[Manager]
ShowStatus=no
