# bluez-alsa-utils' shipped bluealsa.service defaults to
# "bluealsa -S -p a2dp-source -p a2dp-sink" (confirmed running as-is on
# gexis - not something we set). a2dp-source lets the Pi *send* audio to a
# Bluetooth speaker, which is not a requirement (ARCHITECTURE.md: A2DP
# sink only) and is an extra profile advertised to, and negotiated with,
# every device that pairs. Dropped rather than left in by accident.
[Service]
ExecStart=
ExecStart=/usr/bin/bluealsa -S -p a2dp-sink
