# bluez-alsa-utils ships bluealsa-aplay.service already (WantedBy=
# bluetooth.target, auto-enabled on install). Its shipped default is
# --pcm=default, not our output device - override rather than replace the
# unit, per upstream's own documented customisation path (bluealsa-aplay.
# service.in's header comment: "one will have to explicitly clear the
# ExecStart before setting it again").
#
# --mixer-device/--mixer-name added 2026-09-08: without them,
# bluealsa-aplay logged "Couldn't open ALSA mixer: Mixer element not
# found" (it was looking for the ALSA-default name=default elem=Master,
# which don't exist on this image) and never found "output"/"DAC" on
# its own. Flag names confirmed against this build's own
# `bluealsa-aplay --help` before committing, not assumed.
#
# Pointed at hw:gexisbtvol/Master, not output/DAC, since B2 (George's
# decision, same day): --mixer-device=output wrote straight to the real
# hardware mixer whenever the phone's AVRCP volume changed, regardless
# of whether Bluetooth was actually the active renderer - confirmed on
# hardware, raising LMS's volume from its own app audibly changed an
# active Bluetooth stream, because both were writing to the same
# control unconditionally. hw:gexisbtvol is a private snd-dummy control
# with no audio path behind it (image/stage-gexis/00-alsa's modprobe
# config) - gexis-core mirrors it onto the real DAC only while
# Bluetooth is the active renderer (volume.py's DummyMixerBridge).
#
# --volume=mixer added 2026-09-10 (Finding 012), confirming and closing
# Finding 006's "Bluetooth volume partly software" open item. Read
# directly, not guessed: bluez-alsa's own persisted per-device state on
# `gexis` (/var/lib/bluealsa/<MAC>, root-only) had SoftVolume=true for
# this phone, both PCM directions - and bluealsa-aplay's own source
# (utils/aplay/aplay.c, io_worker_mixer_volume_sync_alsa_mixer) skips
# writing to the ALSA mixer entirely whenever soft_volume is true:
# `if (ba_pcm->soft_volume) return 0;`. Confirmed as the actual live
# mechanism, not just plausible: zero "bluetooth -> hardware" mirror log
# lines appeared in two full boot sessions despite bluealsa's own AVRCP
# volume log showing dozens of real 0-127 updates - the dummy control
# got set once (whatever it inherited at acquire time) and never
# touched again, matching George's report precisely: a fixed, too-quiet
# ceiling that didn't track the phone's own slider, with the same fixed
# level reappearing on reconnect. `--volume=mixer` (default is "auto",
# which just inherits whatever soft_volume state bluealsa's daemon
# already had persisted) forces bluealsa-aplay to push
# `SoftVolume=false` for this PCM on every connection (aplay.c
# explicitly calls the D-Bus SoftVolume property update whenever the
# CLI-requested type differs from the PCM's current one) - hardware-
# mixer volume control, which is what we actually have a real,
# controllable ALSA control for.
#
# **`--volume=none` since 2026-09-23 (ADR-0054 §1), and the mixer options
# with it.** Everything above about `--volume=mixer` remains true of what it
# fixed; what it also did was make a loop. bluealsa-aplay writes the ALSA
# control from AVRCP and reads it back out to the phone, and the two scales
# are different *shapes* - bluealsa's AVRCP curve is about 10 dB per
# doubling, the control is linear in dB - so the round trip was measured
# wrong one time in three: 59 of 179 in George's own session, five of them
# jumping straight to 127 (Finding 047 §2). Matching the step counts on
# 2026-09-22 stopped the retry storm and did nothing about the drift.
#
# It also explains a phone connecting quiet while showing maximum.
# bluealsa-aplay(1): "When the audio stream starts then bluealsa-aplay will
# change the Bluetooth volume to match the current setting of the ALSA mixer
# control." The stale control overwrites the phone, by documented design.
#
# `none` keeps the half that mattered: it "will force the BlueALSA PCM
# volume mode setting to native ('pass-through')", which is exactly what
# `--volume=mixer` was adopted for - no software attenuation, full-scale
# audio to the DAC - and then leaves the level alone. The man page names
# this use: "it can be used to allow some other application to apply remote
# volume change requests." That application is gexis-core, which reads and
# writes org.bluealsa.PCM1's own Volume property (bluealsa_volume.py). One
# writer in each direction, and no mixer for a ratchet to live in.
#
# **hw:gexisbtvol is now unused.** The card is still created, because both
# dummy cards come from one snd-dummy instance and the module's mixer range
# is a single value shared by both (/sys/module/snd_dummy/parameters).
#
# After=/Wants=bluealsa.service added 2026-09-08: the stock unit has
# neither, only Requisite=dbus.service, so bluealsa-aplay can start
# before bluealsa has registered org.bluealsa on the bus - observed on
# hardware: "Couldn't get BlueALSA PCM list: The name org.bluealsa was
# not provided by any .service files" at boot. bluealsa-aplay's main
# loop survives this and picks up connections later via D-Bus signals
# regardless (every connection attempted after boot did work), so this
# is a hygiene fix for a real race, not a confirmed fix for a specific
# symptom - but it's exactly the shape of a one-off "doesn't work the
# first time, fine every time after" report.
[Unit]
After=bluealsa.service
Wants=bluealsa.service

[Service]
ExecStart=
ExecStart=/usr/bin/bluealsa-aplay --pcm=output --volume=none
