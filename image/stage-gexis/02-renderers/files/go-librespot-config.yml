# go-librespot config. Lives under systemd's StateDirectory=
# (/var/lib/go-librespot), not ~/.config - a system service's state
# shouldn't live under a user account's home directory. go-librespot.service
# passes --config_dir /var/lib/go-librespot explicitly; this is the file
# that path resolves to.
#
# device_name is hardcoded for now. ADR-0022 eventually wants one device
# name propagated everywhere (mDNS hostname, Spotify, Bluetooth); until
# that settings infrastructure exists, this is a plain static value.

device_name: gexis
device_type: avr

audio_backend: alsa
audio_device: output

zeroconf_enabled: true
# avahi, not go-librespot's own built-in mDNS responder: avahi-daemon is
# already running on this image (base layer), so this shares it rather
# than standing up a second mDNS responder.
zeroconf_backend: avahi

# The arbitration core (Phase 2b) needs this: /events (WebSocket) is the
# only acquisition signal for Spotify Connect ("device selected in the
# app", ADR-0010), and /player/stop is how it disconnects on takeover.
#
# `port` is explicit and fixed, not left at whatever upstream defaults to
# when omitted - measured on gexis (2026-09-06, `ss -tlnp` across a
# `systemctl restart`) that leaving it out gives a *different port every
# start* (46227, then 39773), which the arbitration core cannot hardcode
# or discover without extra machinery. `address` is left at upstream's
# documented default (`localhost` - confirmed against
# devgianlu/go-librespot's README) since only the core, on this same
# machine, needs to reach it.
#
# This is NOT the only listener go-librespot opens. Zeroconf pairing
# (`zeroconf_enabled` below) opens a second, separate one, on all
# interfaces - also measured ephemeral by default (42769, then 36043).
# That one is *supposed* to be network-reachable: it's how the Spotify
# phone app finds and pairs with this device over the LAN in the first
# place. An earlier version of this comment claimed the whole server was
# "loopback-only, so nothing outside this machine can reach it" - false,
# conflated the two listeners, corrected here after the all-interfaces
# socket was found by direct measurement, not read in any doc.
server:
  enabled: true
  port: 3678

credentials:
  type: zeroconf
  zeroconf:
    # After the one-time Zeroconf pairing from the phone app, credentials
    # persist so later boots (and scripted testing via the Web API) don't
    # need a phone at all.
    persist_credentials: true
