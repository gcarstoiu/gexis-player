# The device's own music, over SMB (ADR-0115), beside the Pictures share
# (ADR-0049) and on the same terms: one directory, guest-writable because the
# LAN already is.
#
# `force user` is Lyrion's own: every file copied in is one its server can
# read, and its Playlists folder - where Lyrion saves playlists (ADR-0115
# decision 10) - stays writable by it.
[music]
   comment = Gexis music (the Lyrion server's)
   path = /var/lib/gexis-music
   browseable = yes
   writable = yes
   guest ok = yes
   force user = squeezeboxserver
   force group = nogroup
   create mask = 0644
   directory mask = 0755
   map archive = no
   map system = no
   map hidden = no
