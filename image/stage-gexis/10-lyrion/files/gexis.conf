# ADR-0115: the Lyrion server as a plugin. A drop-in over upstream's own unit,
# so an upgrade of its file keeps these.
[Service]
# **Music comes first** (George, 2026-10-02: "music takes priority"): the
# server and its scanner get the processor and the card only when playback
# does not want them. Phase 13e criterion 2 measures that this is enough.
Nice=19
IOSchedulingClass=idle
CPUWeight=10
# More than 13a's 1 GB (George: "Lyrion might need more than 1gb of ram"),
# until a scan of a real library is measured.
MemoryMax=2G
