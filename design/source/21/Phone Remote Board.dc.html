<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<style>
@font-face{font-family:'Nunito Sans';src:url('../../fonts/NunitoSans-Variable.woff2') format('woff2-variations'),url('../../fonts/NunitoSans-Variable.woff2') format('woff2');font-weight:300 800;font-display:block;}
@font-face{font-family:'IBM Plex Mono';src:url('../../fonts/IBMPlexMono-Regular.woff2') format('woff2');font-weight:400;font-display:block;}
@font-face{font-family:'IBM Plex Mono';src:url('../../fonts/IBMPlexMono-SemiBold.woff2') format('woff2');font-weight:500 600;font-display:block;}
html,body{margin:0;padding:0;background:#0c1014;}a{color:#7ed6bc;}a:hover{color:#a8e5d3;}
</style>
</helmet>
<section data-screen-label="Final · Phone remote" style="min-height:100vh;min-width:992px;background:#0c1014;color:#e9eef2;font-family:'Nunito Sans','Avenir Next','Segoe UI',system-ui,sans-serif;padding:56px 56px 96px;display:flex;flex-direction:column;gap:44px;box-sizing:border-box;">
  <div style="display:flex;flex-direction:column;gap:10px;max-width:920px;">
    <div style="font-family:'IBM Plex Mono','Courier New',monospace;font-size:13px;letter-spacing:0.2em;text-transform:uppercase;color:#7ed6bc;">Phase 21 · the phone</div>
    <div style="font-size:44px;font-weight:700;letter-spacing:-0.015em;">Phone remote, final</div>
    <div style="font-size:18px;line-height:1.5;color:rgba(233,238,242,0.72);text-wrap:pretty;">Living Room has a screen, Kitchen has none. Switch players on either phone to move between the two.</div>
  </div>
  <div style="display:flex;flex-wrap:nowrap;gap:56px;align-items:flex-start;">
    <div id="screen" style="display:flex;flex-direction:column;gap:16px;width:412px;">
      <div style="display:flex;align-items:center;gap:12px;"><span style="font-family:'IBM Plex Mono','Courier New',monospace;font-size:14px;font-weight:600;padding:4px 10px;border-radius:8px;background:rgba(126,214,188,0.16);color:#7ed6bc;">Screen</span><span style="font-size:22px;font-weight:700;white-space:nowrap;">Living Room</span></div>
      <div style="width:412px;height:915px;border-radius:36px;overflow:hidden;box-shadow:0 0 0 1px rgba(233,238,242,0.14),0 30px 80px rgba(0,0,0,0.55);position:relative;">
        <dc-import name="Phone Remote v2" player="living" start-pad="{{ startPad }}" source="{{ source }}" hint-size="412px,915px" style="width:412px;height:915px;display:block;"></dc-import>
      </div>
    </div>
    <div id="no-screen" style="display:flex;flex-direction:column;gap:16px;width:412px;">
      <div style="display:flex;align-items:center;gap:12px;"><span style="font-family:'IBM Plex Mono','Courier New',monospace;font-size:14px;font-weight:600;padding:4px 10px;border-radius:8px;background:rgba(126,214,188,0.16);color:#7ed6bc;">No screen</span><span style="font-size:22px;font-weight:700;white-space:nowrap;">Kitchen</span></div>
      <div style="width:412px;height:915px;border-radius:36px;overflow:hidden;box-shadow:0 0 0 1px rgba(233,238,242,0.14),0 30px 80px rgba(0,0,0,0.55);position:relative;">
        <dc-import name="Phone Remote v2" player="kitchen" start-pad="{{ startPad }}" source="{{ source }}" hint-size="412px,915px" style="width:412px;height:915px;display:block;"></dc-import>
      </div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;startPad&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;touchpad&quot;,&quot;dpad&quot;],&quot;default&quot;:&quot;touchpad&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Both phones&quot;},&quot;source&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;lms&quot;,&quot;spotify&quot;,&quot;bluetooth&quot;],&quot;default&quot;:&quot;lms&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Both phones&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { startPad: this.props.startPad ?? 'touchpad', source: this.props.source ?? 'lms' };
  }
}
</script>
</body>
</html>
