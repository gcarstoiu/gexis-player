<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<style>

@font-face{font-family:'IBM Plex Mono';src:url('../../fonts/IBMPlexMono-Regular.woff2') format('woff2');font-weight:400;font-display:block;}
@font-face{font-family:'IBM Plex Mono';src:url('../../fonts/IBMPlexMono-SemiBold.woff2') format('woff2');font-weight:500 600;font-display:block;}
html,body{margin:0;padding:0;background:#0c1014;}a{color:#7ed6bc;}a:hover{color:#a8e5d3;}

          <div style="width:410px;height:914px;border-radius:44px;overflow:hidden;display:flex;flex-direction:column;background:#1f2326;">

              <div style="flex:1;min-width:0;height:44px;border-radius:22px;background:#303336;display:flex;align-items:center;gap:10px;padding:0 16px;box-sizing:border-box;">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"></path><circle cx="16" cy="8" r="2"></circle><circle cx="8" cy="16" r="2"></circle></svg>
                <span style="font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">gexis.local</span>
              </div>
              <span style="width:20px;height:20px;border:2px solid #e3e3e3;border-radius:5px;box-sizing:border-box;display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0;">1</span>

            </div>
            <div style="position:relative;width:410px;height:780px;flex-shrink:0;overflow:hidden;">
              <dc-import name="Phone Remote v3" player="living" start-pad="{{ startPad }}" source="{{ source }}" volume="{{ volume }}" hint-size="410px,780px" style="width:410px;height:780px;display:block;"></dc-import>
            </div>
            <div style="height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#0e161c;"><span style="width:108px;height:4px;border-radius:2px;background:rgba(233,238,242,0.5);display:block;"></span></div>
          </div>
        </div>
      </div>
    </div>

    <div id="no-screen" style="display:flex;flex-direction:column;gap:16px;width:440px;">
      <div style="display:flex;align-items:center;gap:12px;"><span style="font-family:'IBM Plex Mono','Courier New',monospace;font-size:14px;font-weight:600;padding:4px 10px;border-radius:8px;background:rgba(126,214,188,0.16);color:#7ed6bc;">No screen</span><span style="font-size:22px;font-weight:700;white-space:nowrap;">Kitchen</span></div>
      <div style="position:relative;width:440px;height:944px;">
        <span style="position:absolute;right:-3px;top:196px;width:4px;height:64px;border-radius:0 3px 3px 0;background:#3b3f43;display:block;"></span>
        <span style="position:absolute;right:-3px;top:300px;width:4px;height:120px;border-radius:0 3px 3px 0;background:#3b3f43;display:block;"></span>
        <div style="position:absolute;inset:0;border-radius:58px;background:#0a0b0c;box-shadow:0 0 0 2px #3b3f43,0 40px 90px rgba(0,0,0,0.6);padding:15px;box-sizing:border-box;">
          <div style="width:410px;height:914px;border-radius:44px;overflow:hidden;display:flex;flex-direction:column;background:#1f2326;">
            <div style="position:relative;height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-family:system-ui,sans-serif;font-size:14px;font-weight:500;color:#e9eef2;">
              <span>9:30</span>
              <span style="position:absolute;left:50%;top:14px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#050506;display:block;"></span>
              <span style="display:flex;align-items:center;gap:6px;">
                <svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 13.3L.67 5.97a10.37 10.37 0 0114.66 0L8 13.3z" fill="currentColor"></path></svg>
                <svg viewBox="0 0 16 16" width="14" height="14"><path d="M14.67 14.67V1.33L1.33 14.67h13.34z" fill="currentColor"></path></svg>
                <span style="position:relative;width:9px;height:15px;border-radius:2px;background:#e9eef2;display:block;"><span style="position:absolute;left:2.5px;top:-2px;width:4px;height:2px;border-radius:1px 1px 0 0;background:#e9eef2;display:block;"></span></span>
              </span>
            </div>
            <div style="height:58px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;box-sizing:border-box;font-family:system-ui,sans-serif;color:#e3e3e3;">
              <div style="flex:1;min-width:0;height:44px;border-radius:22px;background:#303336;display:flex;align-items:center;gap:10px;padding:0 16px;box-sizing:border-box;">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"></path><circle cx="16" cy="8" r="2"></circle><circle cx="8" cy="16" r="2"></circle></svg>
                <span style="font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">gexis.local</span>
              </div>
              <span style="width:20px;height:20px;border:2px solid #e3e3e3;border-radius:5px;box-sizing:border-box;display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0;">1</span>
              <svg viewBox="0 0 24 24" width="22" height="22" style="flex-shrink:0;"><circle cx="12" cy="5" r="1.8" fill="currentColor"></circle><circle cx="12" cy="12" r="1.8" fill="currentColor"></circle><circle cx="12" cy="19" r="1.8" fill="currentColor"></circle></svg>
            </div>
            <div style="position:relative;width:410px;height:780px;flex-shrink:0;overflow:hidden;">
              <dc-import name="Phone Remote v3" player="kitchen" start-pad="{{ startPad }}" source="{{ source }}" volume="{{ volume }}" hint-size="410px,780px" style="width:410px;height:780px;display:block;"></dc-import>
            </div>
            <div style="height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#0e161c;"><span style="width:108px;height:4px;border-radius:2px;background:rgba(233,238,242,0.5);display:block;"></span></div>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;startPad&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;touchpad&quot;,&quot;dpad&quot;],&quot;default&quot;:&quot;touchpad&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Both phones&quot;},&quot;volume&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;variable&quot;,&quot;fixed&quot;],&quot;default&quot;:&quot;variable&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Both phones&quot;},&quot;source&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;lms&quot;,&quot;spotify&quot;,&quot;bluetooth&quot;],&quot;default&quot;:&quot;lms&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Both phones&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { startPad: this.props.startPad ?? 'touchpad', source: this.props.source ?? 'lms', volume: this.props.volume ?? 'variable' };
  }
}
</script>
</body>
</html>
