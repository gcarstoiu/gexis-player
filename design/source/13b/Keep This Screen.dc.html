<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,300..800&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<style>html,body{margin:0;padding:0;background:#0c1014;}a{color:#7ed6bc;}a:hover{color:#a8e5d3;}</style>
</helmet>
<div data-screen-label="Keep this screen?" style="width:{{ wPx }};height:{{ hPx }};position:relative;overflow:hidden;box-sizing:border-box;font-family:'Nunito Sans','Avenir Next','Segoe UI',system-ui,sans-serif;color:#e9eef2;background:radial-gradient(130% 105% at 20% 42%,rgba(20,33,42,0.72),rgba(13,21,28,0.96)),#101a21;">
  <div style="position:absolute;left:0;right:0;bottom:0;height:8px;background:rgba(233,238,242,0.08);"><div style="position:absolute;left:0;top:0;bottom:0;background:#7ed6bc;width:{{ leftPct }};"></div></div>

  <sc-if value="{{ isStd }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;left:56px;right:56px;top:30px;display:flex;align-items:center;gap:16px;"><img src="gexis-mark.svg" alt="" width="40" height="40" style="width:40px;height:40px;display:block;" /><span style="font-family:'IBM Plex Mono','Courier New',monospace;font-size:16px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(233,238,242,0.6);">Screen</span></div>
    <div style="position:absolute;inset:96px 56px 60px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;">
      <div style="font-size:72px;font-weight:800;letter-spacing:-0.02em;line-height:1.05;">Keep this screen?</div>
      <div style="font-size:32px;line-height:1.3;color:rgba(233,238,242,0.82);">{{ model }}</div>
      <sc-if value="{{ untested }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:center;gap:16px;padding:14px 24px;border-radius:16px;font-size:24px;color:#e0a758;background:rgba(224,167,88,0.12);border:2px solid rgba(224,167,88,0.45);"><svg viewBox="0 0 64 64" width="34" height="34" style="flex-shrink:0;"><path d="M32 7 L60 56 H4 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"></path><path d="M32 24 V39" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"></path><circle cx="32" cy="47.5" r="3.4" fill="currentColor"></circle></svg><span>This model has not been tested with gexis</span></div>
      </sc-if>
      <div style="display:flex;align-items:center;gap:20px;margin-top:14px;">
        <div style="height:74px;padding:0 40px;border-radius:18px;background:rgba(233,238,242,0.07);border:1px solid rgba(233,238,242,0.16);display:flex;align-items:center;font-size:24px;font-weight:700;">Go back now</div>
        <div style="height:96px;padding:0 64px;border-radius:24px;background:#7ed6bc;display:flex;align-items:center;font-size:32px;font-weight:800;color:#0d151c;box-shadow:0 12px 30px rgba(126,214,188,0.3);">Keep</div>
      </div>
      <div style="font-family:'IBM Plex Mono','Courier New',monospace;font-size:20px;letter-spacing:0.04em;color:rgba(233,238,242,0.7);margin-top:6px;">Going back to {{ prev }} in {{ left }} s</div>
    </div>
  </sc-if>

  <sc-if value="{{ isBar }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:40px;right:40px;top:22px;display:flex;align-items:center;gap:14px;"><img src="gexis-mark.svg" alt="" width="32" height="32" style="width:32px;height:32px;display:block;" /><span style="font-family:'IBM Plex Mono','Courier New',monospace;font-size:15px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(233,238,242,0.6);">Screen</span></div>
    <div style="position:absolute;inset:66px 56px 40px;display:flex;align-items:center;gap:48px;">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;">
        <div style="font-size:56px;font-weight:800;letter-spacing:-0.02em;line-height:1.05;">Keep this screen?</div>
        <div style="font-size:26px;line-height:1.3;color:rgba(233,238,242,0.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ model }}</div>
        <sc-if value="{{ untested }}" hint-placeholder-val="{{ false }}"><div style="font-size:20px;color:#e0a758;">This model has not been tested with gexis</div></sc-if>
        <div style="font-family:'IBM Plex Mono','Courier New',monospace;font-size:18px;letter-spacing:0.04em;color:rgba(233,238,242,0.7);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Going back to {{ prev }} in {{ left }} s</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px;flex-shrink:0;width:260px;">
        <div style="height:110px;border-radius:24px;background:#7ed6bc;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#0d151c;box-shadow:0 12px 30px rgba(126,214,188,0.3);">Keep</div>
        <div style="height:74px;border-radius:18px;background:rgba(233,238,242,0.07);border:1px solid rgba(233,238,242,0.16);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;">Go back now</div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;family&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;standard&quot;,&quot;bar&quot;],&quot;default&quot;:&quot;standard&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;w&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1280,&quot;tsType&quot;:&quot;number&quot;},&quot;h&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[720,768,800,853],&quot;default&quot;:800,&quot;tsType&quot;:&quot;number&quot;},&quot;left&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:30,&quot;step&quot;:1,&quot;default&quot;:24,&quot;tsType&quot;:&quot;number&quot;},&quot;untested&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;model&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
// Phase 13b round 2 (ADR-0109 decision 5): shown on the panel after a screen or
// rotation is chosen and the player has restarted on it. Keep is a touch on the
// panel itself, so it proves the picture and the touch input together. With no
// touch within 30 s the player goes back to the previous screen. Until Keep,
// the setup network keeps its fixed password.
class Component extends DCLogic {
  renderVals() {
    const fam = this.props.family || 'standard';
    const bar = fam === 'bar';
    const W = this.props.w || (bar ? 1280 : 1280), H = bar ? 400 : (this.props.h || 800);
    const left = this.props.left ?? 24;
    return {
      wPx: W + 'px', hPx: H + 'px', isStd: !bar, isBar: bar,
      model: this.props.model || (bar ? 'Waveshare 7.9\u2033 HDMI LCD \u00b7 1280 \u00d7 400' : 'Waveshare 13.3\u2033 HDMI LCD (H) \u00b7 1920 \u00d7 1080'),
      prev: 'Waveshare 10.1\u2033 HDMI LCD (B)',
      untested: !!this.props.untested, left: String(left), leftPct: Math.round(left / 30 * 100) + '%'
    };
  }
}
</script>
</body>
</html>
